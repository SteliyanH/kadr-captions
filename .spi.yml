# Opts this package in to Swift Package Index documentation hosting.
#
# A bare `documentation_targets` produces one documentation build on the
# default builder pair (macOS / current Swift). KadrCaptions is pure Swift
# with no UIKit dependency, so it builds there; if that ever changes, add
# `platform: ios` to this config rather than removing the manifest.
#
# Validate changes at https://swiftpackageindex.com/validate-spi-manifest
version: 1
builder:
  configs:
    - documentation_targets: [KadrCaptions]
