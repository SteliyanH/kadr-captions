name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Tools/readme-snippets.sh copies every ```swift block in README.md into
      # Examples/ReadmeSnippets.swift, which the KadrCaptionsExamples target
      # compiles: `swift test` here, and the iOS build below. This step fails if
      # that copy is stale, so a README edit cannot skip the compiler.
      - name: README snippets are current
        run: Tools/readme-snippets.sh --check

      - run: swift test

      # `swift test` runs on macOS, where every `#if os(iOS)` and
      # `#if canImport(UIKit)` body is excluded — 10 lines here. This package
      # compiles for iOS today; nothing was checking that it stayed that way.
      #
      # kadr-audio had the identical gap and its iOS slice did not compile at all,
      # through six releases, with a green suite the whole time. Prevention here,
      # not a fix.
      #
      # The scheme is the shared one in .swiftpm/xcode/xcshareddata: it builds
      # the library and the README examples. Xcode generates a scheme only per
      # product, and the examples target is deliberately not one.
      - name: Build for iOS
        run: xcodebuild -scheme KadrCaptions-Package -destination 'generic/platform=iOS' -quiet build
